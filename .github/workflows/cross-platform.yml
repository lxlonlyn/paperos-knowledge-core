name: Cross-platform compatibility

on:
  push:
  pull_request:

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/local_models/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock

      - name: Build local inference runtime
        working-directory: services/local_models
        run: |
          npm ci
          npm run build

      - name: Compile and lint Python
        run: |
          python -m compileall -q paperos_core scripts
          ruff check paperos_core scripts

      - name: Import modules and load isolated configuration
        run: python scripts/check_cross_platform.py
