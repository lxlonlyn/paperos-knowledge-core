[data]
directory = "~/paperos-knowledge-core/data"
dataset = "papers"

[mineru]
provider = "cloud"
endpoint = ""
use_async_tasks = true
poll_interval_seconds = 2.0
timeout_seconds = 1800
preferred_backend = "auto"

[deepseek]
endpoint = "https://api.deepseek.com/v1"
model = "deepseek/deepseek-v4-flash"
timeout_seconds = 180
max_attempts = 3

[local_inference]
host = "127.0.0.1"
port = 8081
request_timeout_seconds = 120
startup_timeout_seconds = 180

[local_inference.embedding]
model_path = "../data/models/embedding/embeddinggemma-300M-Q8_0.gguf"
model = "default"
dimensions = 768
max_tokens = 2048

[local_inference.reranker]
model_path = "../data/models/reranker/qwen3-reranker-0.6b-q8_0.gguf"
candidate_limit = 40

[local_inference.query_expansion]
model_path = "../data/models/query-expansion/qmd-query-expansion-1.7B-q4_k_m.gguf"
max_output_tokens = 512

[cognee]
system_database = "cognee/system/databases"
vector_database = "cognee/vector"
graph_database = "cognee/graph"
db_provider = "sqlite"
vector_provider = "lancedb"
graph_provider = "kuzu"

[ingestion]
max_file_mb = 200
chunk_target_tokens = 900
chunk_overlap_tokens = 135

[retrieval]
default_profile = "comprehensive"
top_k = 12
candidate_pool_size = 40
graph_depth = 2
max_chunks_per_document = 3
max_chunks_per_section = 2

[retrieval.profiles.comprehensive]
lexical_weight = 1.0
semantic_weight = 1.0
graph_weight = 1.0
global_context_weight = 0.6
confirmed_knowledge_weight = 1.2

[retrieval.profiles.truth]
lexical_weight = 1.4
semantic_weight = 1.2
graph_weight = 0.6
global_context_weight = 0.3
confirmed_knowledge_weight = 1.5

[retrieval.profiles.associative]
lexical_weight = 0.7
semantic_weight = 1.0
graph_weight = 1.5
global_context_weight = 1.2
confirmed_knowledge_weight = 1.0

[api]
host = "127.0.0.1"
port = 8000
