[data]
directory = "../data"
dataset = "papers"

[mineru]
provider = "cloud"
endpoint = ""
# Secrets may be stored only in the git-ignored config/paperos.toml.
api_key = ""
use_async_tasks = true
poll_interval_seconds = 2.0
timeout_seconds = 1800
preferred_backend = "auto"

[cognee.llm]
provider = "openai"
model = "openai/gpt-5-mini"
endpoint = ""
api_key = ""
max_completion_tokens = 16384
temperature = 0.0

[cognee.embedding]
provider = "custom"
model = "default"
endpoint = "http://127.0.0.1:8081/v1"
api_key = ""
dimensions = 768
max_tokens = 2048
batch_size = 5

[cognee.storage]
relational_provider = "sqlite"
vector_provider = "lancedb"
graph_provider = "kuzu"
vector_subprocess_enabled = true
graph_subprocess_enabled = true

[local_inference]
enabled = false
host = "127.0.0.1"
port = 8081
embedding_model_path = "../data/models/embedding/embeddinggemma-300M-Q8_0.gguf"
reranker_model_path = "../data/models/reranker/qwen3-reranker-0.6b-q8_0.gguf"
cuda_devices = [6, 7]
startup_timeout = 180
request_timeout = 120

[ingestion]
max_file_mb = 200
chunk_target_tokens = 900
chunk_hard_max_tokens = 1200
chunk_overlap_tokens = 0
claim_enrichment_enabled = false

[retrieval]
top_k = 12
candidate_pool_size = 40
rerank_enabled = true
synthesis_max_input_tokens = 48000

[api]
host = "127.0.0.1"
port = 8000
